[package]
name = "agentla-bootloader"
version = "0.1.0"
edition = "2021"
description = "Invariant 1st-stage Boot Switcher for AgentLA RP2350 A/B dual-slot execution"
license = "MIT OR Apache-2.0"

[[bin]]
name = "agentla-bootloader"
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
panic-halt = "0.2"
defmt = "1.0.1"
defmt-rtt = "1.0.1"
embassy-time = "0.5.1"
agentla-boot-proto = { path = "../agentla-boot-proto" }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "critical-section-impl", "defmt"] }

[features]
default = []
