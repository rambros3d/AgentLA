[package]
name = "agentla-bridges"
version = "0.1.0"
edition = "2024"
authors = ["AgentLA Authors"]
description = "Embassy-aligned USB bridge protocol engines for Linux gs_usb, i2c-tiny-usb, and SLCAN"
license = "Apache-2.0"

[dependencies]
embedded-hal = "1.0"
embedded-can = "0.4"
byteorder = { version = "1.5", default-features = false }
heapless = "0.9"
defmt = { version = "1.0.1", optional = true }

[features]
default = []
std = []
defmt = ["dep:defmt", "heapless/defmt"]
