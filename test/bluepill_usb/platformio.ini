[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

board_build.mcu = stm32f103c8
board_build.f_cpu = 72000000L

build_flags =
    -Os
    -DUSBCON
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740
    -DUSB_MANUFACTURER="STM32"
    -DUSB_PRODUCT="\"BluePill CDC Serial\""
