; PlatformIO BluePill Blink Firmware
; Builds a 1-second blink on PC13 (active LOW LED)
; Binary output: .pio/build/bluepill_f103c8/firmware.bin

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; Build settings
board_build.mcu = stm32f103c8
board_build.f_cpu = 72000000L

; No upload — we flash via AgentLA SWD
upload_protocol = custom

; Output binary for external flashing
board_build.bin_address = 0x08000000

; Minimize firmware size
build_flags = -Os -flto
