[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentla"
version = "0.1.0"
description = "Python SDK for AgentLA Logic Analyzer - Designed for LLM Agent Integration"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
authors = [
    {name = "AgentLA Contributors"}
]
keywords = ["logic-analyzer", "electronics", "debugging", "llm", "agent", "rp2350", "pico"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.990",
]
sigrok = [
    "sigrokdecode>=0.4",
]

[project.urls]
Homepage = "https://github.com/AgentLA/AgentLA"
Documentation = "https://github.com/AgentLA/AgentLA/tree/main/docs"
Repository = "https://github.com/AgentLA/AgentLA"
Issues = "https://github.com/AgentLA/AgentLA/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentla"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
