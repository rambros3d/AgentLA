[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP2350"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "debug"
EMBASSY_USB_MAX_INTERFACE_COUNT = "16"
EMBASSY_USB_MAX_HANDLER_COUNT = "16"
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "65536"
