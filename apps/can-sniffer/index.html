<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAN Bus Analyzer — AgentLA</title>
  <script>
    // Restore system theme immediately before render to avoid flash
    (function() {
      var savedMode = localStorage.getItem('agentla-theme-mode');
      var saved = localStorage.getItem('agentla-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        var isLight = (saved === 'emerald' || saved === 'caramellatte' || saved === 'light');
        document.documentElement.setAttribute('data-theme-scheme', isLight ? 'light' : 'dark');
      } else if (savedMode === 'light') {
        document.documentElement.setAttribute('data-theme', 'emerald');
        document.documentElement.setAttribute('data-theme-scheme', 'light');
      } else if (savedMode === 'dark') {
        document.documentElement.setAttribute('data-theme', 'forest');
        document.documentElement.setAttribute('data-theme-scheme', 'dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'emerald');
        document.documentElement.setAttribute('data-theme-scheme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'forest');
        document.documentElement.setAttribute('data-theme-scheme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/daisyui.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/themes.css">
  <script src="/agentla-bridge.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-base-100 text-base-content overflow-hidden select-none">

  <!-- Unified Clean OS Top Bar -->
  <header id="top-bar" class="navbar bg-base-200 border-b border-base-300 px-4 py-1.5 min-h-0 flex justify-between items-center z-30">
    <div class="navbar-start flex items-center gap-2">
      <a href="/home/" class="brand-item flex items-center gap-2 text-inherit no-underline" title="AgentLA App Launcher">
        <span class="start-menu-icon" aria-hidden="true"></span>
        <span class="font-bold tracking-tight text-sm">AgentLA</span>
        <span class="status status-success status-xs" title="Hardware Engine Online"></span>
      </a>
      <span class="text-base-content/30 mx-1">/</span>
      <span class="font-semibold text-xs flex items-center gap-1.5 text-base-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-primary" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 15h2c.6 0 1-.4 1-1v-2c0-.7-.5-1.3-1.2-1.4L15 10l-2-2H8l-1.5 2.2A2 2 0 0 0 6 11v3c0 .6.4 1 1 1h1"/>
          <circle cx="9" cy="15" r="1.5"/><circle cx="15" cy="15" r="1.5"/>
        </svg>
        CAN Bus Analyzer
      </span>
    </div>

    <div class="navbar-end flex items-center gap-2">
      <!-- WebSocket Status Badge -->
      <div id="ws-badge" class="badge badge-error badge-sm gap-1.5 font-medium transition-all">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-current"></span>
        <span id="ws-status-text">Disconnected</span>
      </div>

      <!-- Target Power Rail Toggle Pill -->
      <button class="preset-pill target-power-pill active-on" id="btn-target-power-pill" title="Target Power Rail (Click to toggle ON/OFF)">
        <svg class="solar-icon power-bolt-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span class="power-pill-label" id="top-bar-power-text"><span id="top-bar-voltage-val">3.31V</span> · <span id="top-bar-current-val">14mA</span></span>
      </button>

      <!-- Emergency Safe State Button -->
      <button class="preset-pill emergency-safe-btn" id="btn-emergency-safe" title="Emergency Safe State: High-Z all pins & cut power (Hotkey: Shift+Esc)">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align: middle; margin-right: 4px;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        SAFE STATE
      </button>

      <!-- Tri-State Theme Toggle -->
      <button class="theme-toggle-btn mode-system" id="btn-theme-toggle" data-mode="system" title="Theme Mode: System (Auto)">
        <svg class="solar-icon icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Controls & Filtering Bar -->
  <div class="bg-base-200/80 border-b border-base-300 px-4 py-2 flex flex-wrap items-center justify-between gap-3 text-xs">
    <div class="flex items-center gap-3 flex-wrap">
      <!-- Bitrate Selector -->
      <div class="flex items-center gap-1.5">
        <span class="text-base-content/70 font-medium">Bitrate:</span>
        <select id="sel-baud" class="select select-bordered select-xs bg-base-100 font-mono w-28">
          <option value="10000">10 kbps</option>
          <option value="20000">20 kbps</option>
          <option value="50000">50 kbps</option>
          <option value="100000">100 kbps</option>
          <option value="125000">125 kbps</option>
          <option value="250000">250 kbps</option>
          <option value="500000" selected>500 kbps</option>
          <option value="800000">800 kbps</option>
          <option value="1000000">1 Mbps</option>
        </select>
      </div>

      <!-- 120 Ohm Termination Toggle -->
      <button id="btn-term-toggle" class="btn btn-xs btn-outline" title="Toggle software-controlled 120Ω bus termination on GPIO 22">
        <span id="term-icon">⚡</span>
        <span id="term-label">120Ω Term: OFF</span>
      </button>

      <!-- ID Filter Input -->
      <div class="join">
        <span class="join-item btn btn-xs btn-neutral pointer-events-none text-base-content/60 font-sans">Filter</span>
        <input type="text" id="input-filter-id" placeholder="0x7DF or ID" class="input input-bordered input-xs join-item font-mono w-28 bg-base-100">
      </div>

      <!-- Auto-scroll checkbox -->
      <label class="label cursor-pointer gap-1.5 py-0">
        <input type="checkbox" id="chk-autoscroll" class="checkbox checkbox-xs checkbox-primary" checked>
        <span class="label-text text-xs">Auto-scroll</span>
      </label>
    </div>

    <!-- Right Action Buttons -->
    <div class="join">
      <button id="btn-connect" class="btn btn-xs btn-primary join-item">Connect</button>
      <button id="btn-clear" class="btn btn-xs btn-ghost join-item" title="Clear packet log">Clear</button>
      <button id="btn-export-csv" class="btn btn-xs btn-neutral join-item" title="Export captured frames to CSV">Export CSV</button>
    </div>
  </div>

  <!-- Live Packet Inspector Table -->
  <main class="flex-1 flex flex-col overflow-hidden bg-base-100">
    <div class="flex-1 overflow-y-auto" id="table-container">
      <table class="table table-pin-rows table-xs w-full font-mono" id="can-table">
        <thead>
          <tr class="bg-base-200 text-base-content/70">
            <th class="w-16">#</th>
            <th class="w-28">Time (s)</th>
            <th class="w-24">ID</th>
            <th class="w-16">Type</th>
            <th class="w-14">RTR</th>
            <th class="w-14">DLC</th>
            <th>Data (Hex)</th>
            <th class="w-32">ASCII</th>
          </tr>
        </thead>
        <tbody id="can-tbody" class="divide-y divide-base-300">
          <!-- Rows dynamically appended here -->
        </tbody>
      </table>
    </div>

    <!-- Frame Injector (TX) Panel -->
    <section class="bg-base-200 border-t border-base-300 p-3 flex flex-col gap-2 shadow-inner">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <span class="font-bold text-xs text-primary flex items-center gap-1.5">
          <span>📤</span> Frame Injector (TX)
        </span>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-base-content/60">Presets:</span>
          <div class="flex gap-1">
            <span class="badge badge-sm badge-outline cursor-pointer hover:badge-primary transition-colors" onclick="applyPreset('0x7DF', false, false, 8, '02 01 0D 00 00 00 00 00')">OBD-II Speed</span>
            <span class="badge badge-sm badge-outline cursor-pointer hover:badge-primary transition-colors" onclick="applyPreset('0x7DF', false, false, 8, '02 01 0C 00 00 00 00 00')">OBD-II RPM</span>
            <span class="badge badge-sm badge-outline cursor-pointer hover:badge-primary transition-colors" onclick="applyPreset('0x100', false, false, 4, 'DE AD BE EF')">Heartbeat</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <!-- Frame ID -->
        <div class="flex items-center gap-1">
          <span class="text-xs text-base-content/70">ID:</span>
          <input type="text" id="tx-id" value="0x7DF" class="input input-bordered input-xs font-mono w-20 bg-base-100">
        </div>

        <!-- Extended ID toggle -->
        <label class="label cursor-pointer gap-1.5 py-0">
          <input type="checkbox" id="tx-ext" class="checkbox checkbox-xs checkbox-secondary">
          <span class="label-text text-xs">Extended</span>
        </label>

        <!-- RTR toggle -->
        <label class="label cursor-pointer gap-1.5 py-0">
          <input type="checkbox" id="tx-rtr" class="checkbox checkbox-xs checkbox-warning">
          <span class="label-text text-xs">RTR</span>
        </label>

        <!-- DLC -->
        <div class="flex items-center gap-1">
          <span class="text-xs text-base-content/70">DLC:</span>
          <select id="tx-dlc" class="select select-bordered select-xs font-mono w-14 bg-base-100">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
          </select>
        </div>

        <!-- Hex Data -->
        <div class="flex-1 flex items-center gap-1 min-w-[200px]">
          <span class="text-xs text-base-content/70">Data:</span>
          <input type="text" id="tx-data" value="02 01 0D 00 00 00 00 00" placeholder="Hex bytes space separated" class="input input-bordered input-xs font-mono flex-1 bg-base-100">
        </div>

        <!-- Send Button -->
        <button id="btn-send-tx" class="btn btn-xs btn-accent font-semibold">Send Frame</button>

        <!-- Periodic Transmit Loop -->
        <div class="join items-center">
          <label class="join-item label cursor-pointer gap-1 bg-base-300 px-2 py-0.5 border border-base-content/20 rounded-l-btn">
            <input type="checkbox" id="chk-periodic" class="checkbox checkbox-xs checkbox-info">
            <span class="label-text text-xs">Every</span>
          </label>
          <select id="sel-period" class="join-item select select-bordered select-xs font-mono bg-base-100">
            <option value="50">50 ms</option>
            <option value="100" selected>100 ms</option>
            <option value="250">250 ms</option>
            <option value="500">500 ms</option>
            <option value="1000">1000 ms</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Status Bar Footer -->
    <footer class="bg-base-300 px-4 py-1.5 text-xs text-base-content/70 flex justify-between items-center border-t border-base-content/10">
      <div class="flex items-center gap-3">
        <span>RX: <strong id="stat-rx-count" class="text-base-content">0</strong> frames</span>
        <span class="text-base-content/30">·</span>
        <span>TX: <strong id="stat-tx-count" class="text-base-content">0</strong> frames</span>
      </div>
      <div class="flex items-center gap-3">
        <span>Bus: <span id="stat-bus-state" class="text-success font-semibold">READY</span></span>
        <span class="text-base-content/30">·</span>
        <span>Termination: <strong id="stat-term-state">OFF</strong></span>
      </div>
    </footer>
  </main>

  <script>
    let ws = null;
    let frames = [];
    let frameCount = 0;
    let rxCount = 0;
    let txCount = 0;
    let startTime = null;
    let terminationActive = false;
    let periodicInterval = null;

    const wsBadge = document.getElementById('ws-badge');
    const wsStatusText = document.getElementById('ws-status-text');
    const btnConnect = document.getElementById('btn-connect');
    const btnClear = document.getElementById('btn-clear');
    const btnExportCsv = document.getElementById('btn-export-csv');
    const canTbody = document.getElementById('can-tbody');
    const tableContainer = document.getElementById('table-container');
    const chkAutoScroll = document.getElementById('chk-autoscroll');
    const inputFilterId = document.getElementById('input-filter-id');
    const btnTermToggle = document.getElementById('btn-term-toggle');
    const termLabel = document.getElementById('term-label');
    const statTermState = document.getElementById('stat-term-state');
    const statRxCount = document.getElementById('stat-rx-count');
    const statTxCount = document.getElementById('stat-tx-count');

    const txIdInput = document.getElementById('tx-id');
    const txExtChk = document.getElementById('tx-ext');
    const txRtrChk = document.getElementById('tx-rtr');
    const txDlcSel = document.getElementById('tx-dlc');
    const txDataInput = document.getElementById('tx-data');
    const btnSendTx = document.getElementById('btn-send-tx');
    const chkPeriodic = document.getElementById('chk-periodic');
    const selPeriod = document.getElementById('sel-period');

    function updateStatus(state) {
      wsBadge.classList.remove('badge-error', 'badge-warning', 'badge-success');
      if (state === 'connected') {
        wsBadge.classList.add('badge-success');
        wsStatusText.textContent = 'Connected';
        btnConnect.textContent = 'Disconnect';
        btnConnect.classList.remove('btn-primary');
        btnConnect.classList.add('btn-neutral');
      } else if (state === 'connecting') {
        wsBadge.classList.add('badge-warning');
        wsStatusText.textContent = 'Connecting...';
        btnConnect.textContent = 'Connecting...';
      } else {
        wsBadge.classList.add('badge-error');
        wsStatusText.textContent = 'Disconnected';
        btnConnect.textContent = 'Connect';
        btnConnect.classList.add('btn-primary');
        btnConnect.classList.remove('btn-neutral');
      }
    }

    function formatHexBytes(str) {
      if (!str) return '';
      const cleaned = str.replace(/[^0-9A-Fa-f]/g, '');
      const pairs = [];
      for (let i = 0; i < cleaned.length; i += 2) {
        pairs.push(cleaned.slice(i, i + 2).toUpperCase());
      }
      return pairs.join(' ');
    }

    function hexToAscii(hexStr) {
      if (!hexStr) return '';
      const cleaned = hexStr.replace(/[^0-9A-Fa-f]/g, '');
      let ascii = '';
      for (let i = 0; i < cleaned.length; i += 2) {
        const code = parseInt(cleaned.slice(i, i + 2), 16);
        if (code >= 32 && code <= 126) {
          ascii += String.fromCharCode(code);
        } else {
          ascii += '.';
        }
      }
      return ascii;
    }

    function appendFrameRow(frame) {
      if (!startTime) startTime = performance.now();
      const relTime = ((performance.now() - startTime) / 1000).toFixed(4);

      frameCount++;
      rxCount++;
      statRxCount.textContent = rxCount;

      const hexId = '0x' + Number(frame.id).toString(16).toUpperCase();
      const extStr = frame.ext ? 'EXT' : 'STD';
      const rtrStr = frame.rtr ? 'RTR' : 'DATA';
      const rawData = frame.data || '';
      const formattedBytes = formatHexBytes(rawData);
      const ascii = hexToAscii(rawData);

      const frameObj = {
        num: frameCount,
        time: relTime,
        id: hexId,
        ext: extStr,
        rtr: rtrStr,
        dlc: frame.dlc || 0,
        bytes: formattedBytes,
        ascii: ascii
      };
      frames.push(frameObj);

      // Check filter
      const filter = inputFilterId.value.trim().toUpperCase();
      const match = !filter || hexId.includes(filter) || String(frame.id).includes(filter);

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-base-200/50 transition-colors';
      if (!match) tr.style.display = 'none';

      tr.innerHTML = `
        <td class="text-base-content/50">${frameCount}</td>
        <td class="text-base-content/70">+${relTime}</td>
        <td class="font-semibold ${frame.ext ? 'text-secondary' : 'text-primary'}">${hexId}</td>
        <td><span class="badge badge-xs ${frame.ext ? 'badge-secondary' : 'badge-primary'}">${extStr}</span></td>
        <td><span class="badge badge-xs ${frame.rtr ? 'badge-warning' : 'badge-ghost'}">${rtrStr}</span></td>
        <td>${frame.dlc || 0}</td>
        <td class="tracking-wider font-bold text-base-content">${formattedBytes}</td>
        <td class="text-base-content/60">${ascii}</td>
      `;
      canTbody.appendChild(tr);

      // Limit DOM table size to 1000 rows
      if (canTbody.children.length > 1000) {
        canTbody.removeChild(canTbody.firstChild);
      }

      if (chkAutoScroll.checked) {
        tableContainer.scrollTop = tableContainer.scrollHeight;
      }
    }

    let canStream = null;

    function connectWs() {
      if (canStream) {
        canStream.close();
        canStream = null;
        ws = null;
        updateStatus('disconnected');
        return;
      }
      if (ws) {
        ws.close();
        ws = null;
        updateStatus('disconnected');
        return;
      }

      // Endpoint contract: connects to /api/v1/can/ws via AgentLA.can.openStream
      updateStatus('connecting');

      if (window.AgentLA && AgentLA.can && AgentLA.can.openStream) {
        canStream = AgentLA.can.openStream({
          onFrame: (frame) => {
            appendFrameRow(frame);
          },
          onStatus: (status) => {
            updateStatus(status);
          },
          onError: (err) => {
            console.error('CAN stream error', err);
          }
        });
        ws = canStream.getWebSocket ? canStream.getWebSocket() : null;
      } else {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${proto}//${location.host}/api/v1/can/ws`;

        try {
          ws = new WebSocket(wsUrl);

          ws.onopen = () => {
            updateStatus('connected');
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              appendFrameRow(data);
            } catch (_) {}
          };

          ws.onerror = () => {
            updateStatus('disconnected');
          };

          ws.onclose = () => {
            updateStatus('disconnected');
            ws = null;
          };
        } catch (_) {
          updateStatus('disconnected');
        }
      }
    }

    async function toggleTermination() {
      terminationActive = !terminationActive;
      try {
        if (window.AgentLA && AgentLA.can && AgentLA.can.setTermination) {
          await AgentLA.can.setTermination(terminationActive);
          updateTerminationUi(terminationActive);
        } else {
          // Endpoint fallback: /api/v1/bridge/can/termination
          const resp = await fetch('/api/v1/bridge/can/termination', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: terminationActive })
          });
          if (resp.ok) {
            updateTerminationUi(terminationActive);
          }
        }
      } catch (_) {
        updateTerminationUi(terminationActive);
      }
    }

    function updateTerminationUi(active) {
      if (active) {
        btnTermToggle.classList.remove('btn-outline');
        btnTermToggle.classList.add('btn-success');
        termLabel.textContent = '120Ω Term: ON';
        statTermState.textContent = 'ON';
        statTermState.className = 'text-success font-bold';
      } else {
        btnTermToggle.classList.remove('btn-success');
        btnTermToggle.classList.add('btn-outline');
        termLabel.textContent = '120Ω Term: OFF';
        statTermState.textContent = 'OFF';
        statTermState.className = '';
      }
    }

    function parseNumericId(str) {
      str = str.trim();
      if (str.startsWith('0x') || str.startsWith('0X')) {
        return parseInt(str.slice(2), 16) || 0;
      }
      return parseInt(str, 10) || 0;
    }

    async function sendTxFrame() {
      const idVal = parseNumericId(txIdInput.value);
      const isExt = txExtChk.checked;
      const isRtr = txRtrChk.checked;
      const dlcVal = parseInt(txDlcSel.value, 10) || 0;
      const hexCleaned = txDataInput.value.replace(/[^0-9A-Fa-f]/g, '');

      const payload = {
        id: idVal,
        extended: isExt,
        ext: isExt,
        rtr: isRtr,
        dlc: dlcVal,
        data: hexCleaned
      };

      if (window.AgentLA && AgentLA.can && AgentLA.can.send) {
        try {
          await AgentLA.can.send(payload);
          txCount++;
          statTxCount.textContent = txCount;
        } catch (e) {
          console.error("CAN send failed:", e);
        }
      } else if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
        txCount++;
        statTxCount.textContent = txCount;
      }
    }

    function applyPreset(id, ext, rtr, dlc, data) {
      txIdInput.value = id;
      txExtChk.checked = ext;
      txRtrChk.checked = rtr;
      txDlcSel.value = dlc;
      txDataInput.value = data;
    }

    chkPeriodic.addEventListener('change', () => {
      if (chkPeriodic.checked) {
        const ms = parseInt(selPeriod.value, 10) || 100;
        periodicInterval = setInterval(sendTxFrame, ms);
      } else {
        if (periodicInterval) {
          clearInterval(periodicInterval);
          periodicInterval = null;
        }
      }
    });

    selPeriod.addEventListener('change', () => {
      if (chkPeriodic.checked) {
        clearInterval(periodicInterval);
        const ms = parseInt(selPeriod.value, 10) || 100;
        periodicInterval = setInterval(sendTxFrame, ms);
      }
    });

    inputFilterId.addEventListener('input', () => {
      const filter = inputFilterId.value.trim().toUpperCase();
      const rows = canTbody.getElementsByTagName('tr');
      for (const row of rows) {
        const idText = row.children[2]?.textContent || '';
        row.style.display = (!filter || idText.includes(filter)) ? '' : 'none';
      }
    });

    btnSendTx.addEventListener('click', sendTxFrame);
    btnConnect.addEventListener('click', connectWs);
    btnTermToggle.addEventListener('click', toggleTermination);

    btnClear.addEventListener('click', () => {
      canTbody.innerHTML = '';
      frames = [];
      frameCount = 0;
      rxCount = 0;
      statRxCount.textContent = '0';
    });

    btnExportCsv.addEventListener('click', () => {
      if (frames.length === 0) return;
      let csv = 'Index,TimeOffset_s,ID,Type,RTR,DLC,DataHex,ASCII\n';
      for (const f of frames) {
        csv += `${f.num},${f.time},${f.id},${f.ext},${f.rtr},${f.dlc},"${f.bytes}","${f.ascii}"\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `agentla-can-traffic-${new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Auto connect on load
    window.addEventListener('DOMContentLoaded', () => {
      connectWs();
    });
  </script>
</body>
</html>
