[package]
name = "firmware-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-usb = { version = "0.6.0", features = ["defmt", "usbd-hid"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "proto-ipv4", "medium-ethernet", "auto-icmp-echo-reply", "icmp"] }
embassy-net-driver-channel = "0.4.0"
picoserve = { version = "0.20.1", features = ["defmt", "embassy", "ws"] }
littlefs2 = { version = "0.8.1", default-features = false }
generic-array = "0.14"
rp-pac = { version = "7.0.0", features = ["rp235x"] }
defmt = "1.0.1"
defmt-rtt = "1.0.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1"
embedded-io-async = "0.7.0"
portable-atomic = { version = "1.11", features = ["critical-section"] }
heapless = "0.9"
agentla-bsp = { path = "../crates/agentla-bsp" }
agentla-analyzer = { path = "../crates/agentla-analyzer" }
agentla-programmer = { path = "../crates/agentla-programmer", features = ["rp2350-pio"] }
agentla-bridges = { path = "../crates/agentla-bridges", features = ["defmt"] }
agentla-debug-server = { path = "../crates/agentla-debug-server", features = ["defmt"] }
agentla-instruments = { path = "../crates/agentla-instruments", features = ["defmt"] }
agentla-pin-arbiter = { path = "../crates/agentla-pin-arbiter", features = ["defmt"] }
agentla-mcp = { path = "../crates/agentla-mcp" }
agentla-targets = { path = "../crates/agentla-targets", default-features = false, features = ["all-targets"] }
agentla-boot-proto = { path = "../crates/agentla-boot-proto" }
agentla-board-pico2 = { path = "../boards/pico2" }
agentla-board-bakuprobe = { path = "../boards/bakuprobe", optional = true }

[features]
default = ["board-pico2", "slot-a"]
slot-a = []
slot-b = []
board-pico2 = []
board-bakuprobe = ["dep:agentla-board-bakuprobe"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
