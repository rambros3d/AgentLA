name: Deploy AgentLA Landing Page & WebUI Demo to GitHub Pages

on:
  push:
    branches: ["embassy", "dev", "master", "main"]
    paths:
      - "website/**"
      - "webui/**"
      - "boards/demo/**"
      - "apps/**"
      - "tools/build_portal.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble GitHub Pages site via build_portal.py
        run: |
          python3 tools/build_portal.py --output _site

      - name: Upload static portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
