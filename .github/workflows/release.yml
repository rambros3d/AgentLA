name: Release AgentLA Firmware & WebUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout BareBoot (RP2350 USB recovery bootloader)
        uses: actions/checkout@v4
        with:
          repository: bareFOC/bareBoot
          ref: main
          path: bareBoot
          fetch-depth: 1

      - name: Install ARM Embedded Toolchain & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi clang libclang-dev
          GCC_ARM_INC=$(arm-none-eabi-gcc -E -Wp,-v -xc /dev/null 2>&1 | grep "^ /" | tr "\n" " " | sed "s/  */ -I/g" | sed "s/^ -I/-I/" | sed "s/ -I$//")
          echo "BINDGEN_EXTRA_CLANG_ARGS=${GCC_ARM_INC}" >> $GITHUB_ENV
          echo "Clang Include Flags: ${GCC_ARM_INC}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install littlefs-python

      - name: Create build output directory
        run: mkdir -p build

      - name: Pack WebUI Assets (LittleFS image, Tarball, Standalone UF2)
        run: |
          python3 tools/pack_webui.py

      - name: Build BareBoot RP2350 Recovery Bootloader
        # Built in the bareBoot repository; the resulting 32 KB binary is
        # written to flash 0x00000000 (XIP 0x10000000).
        run: |
          cd bareBoot/targets/rp2350-usb
          cargo build --release --target thumbv8m.main-none-eabihf
          cd "${GITHUB_WORKSPACE}"
          arm-none-eabi-objcopy -O binary \
            bareBoot/targets/rp2350-usb/target/thumbv8m.main-none-eabihf/release/bareboot-rp2350 \
            build/bareboot-rp2350.bin

      - name: Build Recovery Application
        # Built from the in-tree agentla-recovery crate; the resulting binary
        # is written to flash 0x00008000 (XIP 0x10008000, 256 KB).
        run: |
          cd crates/agentla-recovery
          cargo build --release --target thumbv8m.main-none-eabihf
          cd "${GITHUB_WORKSPACE}"
          arm-none-eabi-objcopy -O binary \
            target/thumbv8m.main-none-eabihf/release/agentla-recovery \
            build/agentla-recovery.bin

      - name: Build Application Firmware (main app slot, Embassy)
        run: |
          cargo build --release -p firmware-rs --target thumbv8m.main-none-eabihf --no-default-features --features board-pico2

      - name: Extract Release Version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip leading 'v' if present
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package Firmware OTA Binary
        run: |
          python3 tools/package_ota.py \
            target/thumbv8m.main-none-eabihf/release/firmware-rs \
            -o build/agentla-pico2-ota.bin \
            --board PICO2 \
            --version "${{ steps.get_version.outputs.version }}"

      - name: Package Three-Segment BOOTSEL UF2
        # Katapult stage-0 at 0x10000000 (32 KB), recovery app at
        # 0x10008000 (256 KB), and main firmware at 0x10048000 (1 MB).
        # SYSTEM_FS/USER_FS are provisioned at runtime and never shipped here.
        run: |
          python3 tools/package_uf2.py \
            --bootloader build/bareboot-rp2350.bin \
            --recovery build/agentla-recovery.bin \
            --firmware target/thumbv8m.main-none-eabihf/release/firmware-rs \
            --commit-valid \
            -o build/agentla-pico2.uf2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "AgentLA ${{ steps.get_version.outputs.tag }}"
          files: |
            build/agentla-pico2.uf2
            build/agentla-pico2-ota.bin
            build/webui.tar
            build/webui.uf2
          generate_release_notes: true
          draft: false
          prerelease: false
