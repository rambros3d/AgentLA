<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="100%" height="100%" class="board-pinout-svg">
  <defs>
    <style>
      .board-bg { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 12px; }
      .pcb { fill: #064e3b; stroke: #047857; stroke-width: 2; rx: 8px; }
      .rp2350 { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 4px; }
      .pin-pad { fill: #334155; stroke: #e2e8f0; stroke-width: 1.5; cursor: pointer; transition: all 0.2s ease; }
      .pin-pad:hover { fill: #0ea5e9; stroke: #38bdf8; stroke-width: 2.5; }
      .board-pin:hover text { fill: #38bdf8; font-weight: bold; }
      .pin-label { font-family: monospace, sans-serif; font-size: 11px; fill: #cbd5e1; user-select: none; }
      .pin-fn { font-family: sans-serif; font-size: 9px; fill: #64748b; }
      .board-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #f8fafc; }
      .board-subtitle { font-family: sans-serif; font-size: 10px; fill: #10b981; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect x="10" y="10" width="500" height="600" class="board-bg" />

  <!-- PCB Outline -->
  <rect x="120" y="40" width="280" height="540" class="pcb" />

  <!-- USB Connector -->
  <rect x="220" y="25" width="80" height="25" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <text x="260" y="42" font-family="sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="bold">MICRO-USB</text>

  <!-- RP2350 MCU -->
  <rect x="210" y="240" width="100" height="100" class="rp2350" />
  <text x="260" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">RP2350A</text>
  <text x="260" y="300" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Dual Cortex-M33</text>

  <!-- Board Title -->
  <text x="260" y="110" class="board-title" text-anchor="middle">Raspberry Pi Pico 2</text>
  <text x="260" y="125" class="board-subtitle" text-anchor="middle">40-Pin DIP Pinout</text>

  <!-- Left Pins (1 to 20) -->
  <!-- Pin 1: GP0 -->
  <g id="pin-gp0" class="board-pin">
    <rect x="110" y="70" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="82" class="pin-label" text-anchor="end">GP0</text>
    <text x="50" y="82" class="pin-fn" text-anchor="end">I2C0 SDA</text>
  </g>
  <!-- Pin 2: GP1 -->
  <g id="pin-gp1" class="board-pin">
    <rect x="110" y="95" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="107" class="pin-label" text-anchor="end">GP1</text>
    <text x="50" y="107" class="pin-fn" text-anchor="end">I2C0 SCL</text>
  </g>
  <!-- Pin 3: GND -->
  <g id="pin-gnd-1" class="board-pin">
    <rect x="110" y="120" width="20" height="14" rx="2" class="pin-pad" fill="#1e293b" />
    <text x="100" y="132" class="pin-label" text-anchor="end" fill="#64748b">GND</text>
  </g>
  <!-- Pin 4: GP2 -->
  <g id="pin-gp2" class="board-pin">
    <rect x="110" y="145" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="157" class="pin-label" text-anchor="end">GP2</text>
    <text x="50" y="157" class="pin-fn" text-anchor="end">BOOT0</text>
  </g>
  <!-- Pin 5: GP3 -->
  <g id="pin-gp3" class="board-pin">
    <rect x="110" y="170" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="182" class="pin-label" text-anchor="end">GP3</text>
  </g>
  <!-- Pin 6: GP4 -->
  <g id="pin-gp4" class="board-pin">
    <rect x="110" y="195" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="207" class="pin-label" text-anchor="end">GP4</text>
    <text x="50" y="207" class="pin-fn" text-anchor="end">SWCLK / UART1 TX</text>
  </g>
  <!-- Pin 7: GP5 -->
  <g id="pin-gp5" class="board-pin">
    <rect x="110" y="220" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="232" class="pin-label" text-anchor="end">GP5</text>
    <text x="50" y="232" class="pin-fn" text-anchor="end">SWDIO / UART1 RX</text>
  </g>
  <!-- Pin 8: GND -->
  <g id="pin-gnd-2" class="board-pin">
    <rect x="110" y="245" width="20" height="14" rx="2" class="pin-pad" fill="#1e293b" />
    <text x="100" y="257" class="pin-label" text-anchor="end" fill="#64748b">GND</text>
  </g>
  <!-- Pin 9: GP6 -->
  <g id="pin-gp6" class="board-pin">
    <rect x="110" y="270" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="282" class="pin-label" text-anchor="end">GP6</text>
    <text x="50" y="282" class="pin-fn" text-anchor="end">NRST</text>
  </g>
  <!-- Pin 10: GP7 -->
  <g id="pin-gp7" class="board-pin">
    <rect x="110" y="295" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="307" class="pin-label" text-anchor="end">GP7</text>
  </g>
  <!-- Pin 11: GP8 -->
  <g id="pin-gp8" class="board-pin">
    <rect x="110" y="320" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="332" class="pin-label" text-anchor="end">GP8</text>
    <text x="50" y="332" class="pin-fn" text-anchor="end">UART0 TX</text>
  </g>
  <!-- Pin 12: GP9 -->
  <g id="pin-gp9" class="board-pin">
    <rect x="110" y="345" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="357" class="pin-label" text-anchor="end">GP9</text>
    <text x="50" y="357" class="pin-fn" text-anchor="end">UART0 RX</text>
  </g>
  <!-- Pin 14: GP10 -->
  <g id="pin-gp10" class="board-pin">
    <rect x="110" y="395" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="407" class="pin-label" text-anchor="end">GP10</text>
    <text x="50" y="407" class="pin-fn" text-anchor="end">I2C1 SDA</text>
  </g>
  <!-- Pin 15: GP11 -->
  <g id="pin-gp11" class="board-pin">
    <rect x="110" y="420" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="432" class="pin-label" text-anchor="end">GP11</text>
    <text x="50" y="432" class="pin-fn" text-anchor="end">I2C1 SCL</text>
  </g>
  <!-- Pin 16: GP12 -->
  <g id="pin-gp12" class="board-pin">
    <rect x="110" y="445" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="457" class="pin-label" text-anchor="end">GP12</text>
  </g>
  <!-- Pin 17: GP13 -->
  <g id="pin-gp13" class="board-pin">
    <rect x="110" y="470" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="482" class="pin-label" text-anchor="end">GP13</text>
  </g>
  <!-- Pin 19: GP14 -->
  <g id="pin-gp14" class="board-pin">
    <rect x="110" y="520" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="532" class="pin-label" text-anchor="end">GP14</text>
    <text x="50" y="532" class="pin-fn" text-anchor="end">SPI1 SCK</text>
  </g>
  <!-- Pin 20: GP15 -->
  <g id="pin-gp15" class="board-pin">
    <rect x="110" y="545" width="20" height="14" rx="2" class="pin-pad" />
    <text x="100" y="557" class="pin-label" text-anchor="end">GP15</text>
    <text x="50" y="557" class="pin-fn" text-anchor="end">SPI1 TX</text>
  </g>

  <!-- Right Pins (21 to 40) -->
  <!-- Pin 40: VBUS -->
  <g id="pin-vbus" class="board-pin">
    <rect x="390" y="70" width="20" height="14" rx="2" class="pin-pad" fill="#dc2626" />
    <text x="420" y="82" class="pin-label" fill="#f87171">VBUS (5V)</text>
  </g>
  <!-- Pin 39: VSYS -->
  <g id="pin-vsys" class="board-pin">
    <rect x="390" y="95" width="20" height="14" rx="2" class="pin-pad" fill="#ea580c" />
    <text x="420" y="107" class="pin-label" fill="#fb923c">VSYS</text>
  </g>
  <!-- Pin 36: 3V3 OUT -->
  <g id="pin-3v3" class="board-pin">
    <rect x="390" y="170" width="20" height="14" rx="2" class="pin-pad" fill="#eab308" />
    <text x="420" y="182" class="pin-label" fill="#fde047">3V3 (OUT)</text>
  </g>
  <!-- Pin 31: GP26 (ADC0) -->
  <g id="pin-gp26" class="board-pin">
    <rect x="390" y="295" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="307" class="pin-label">GP26</text>
    <text x="465" y="307" class="pin-fn">ADC0</text>
  </g>
  <!-- Pin 32: GP27 (ADC1) -->
  <g id="pin-gp27" class="board-pin">
    <rect x="390" y="320" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="332" class="pin-label">GP27</text>
    <text x="465" y="332" class="pin-fn">ADC1</text>
  </g>
  <!-- Pin 34: GP28 (ADC2) -->
  <g id="pin-gp28" class="board-pin">
    <rect x="390" y="370" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="382" class="pin-label">GP28</text>
    <text x="465" y="382" class="pin-fn">ADC2</text>
  </g>
  <!-- Pin 27: GP21 -->
  <g id="pin-gp21" class="board-pin">
    <rect x="390" y="445" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="457" class="pin-label">GP21</text>
    <text x="465" y="457" class="pin-fn">I2C0 SCL</text>
  </g>
  <!-- Pin 26: GP20 -->
  <g id="pin-gp20" class="board-pin">
    <rect x="390" y="470" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="482" class="pin-label">GP20</text>
    <text x="465" y="482" class="pin-fn">I2C0 SDA</text>
  </g>
  <!-- Pin 22: GP17 -->
  <g id="pin-gp17" class="board-pin">
    <rect x="390" y="520" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="532" class="pin-label">GP17</text>
    <text x="465" y="532" class="pin-fn">SPI0 CSn</text>
  </g>
  <!-- Pin 21: GP16 -->
  <g id="pin-gp16" class="board-pin">
    <rect x="390" y="545" width="20" height="14" rx="2" class="pin-pad" />
    <text x="420" y="557" class="pin-label">GP16</text>
    <text x="465" y="557" class="pin-fn">SPI0 RX</text>
  </g>
</svg>
